
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | GastosTracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#198754">

    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="vendor/sweetalert2/sweetalert2.min.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/bottom-nav.css">
    <link rel="stylesheet" href="assets/css/history.css">
</head>

<body class="bg-light">

    <div id="navbar"></div>

    <div class="container" style="padding-top: 90px;">
        <main class="history-main container-fluid px-3 px-lg-4 py-4 pb-5">

            <!-- Search and Filters -->
            <div class="history-panel mb-4">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-funnel text-success fs-5"></i>
                    <div>
                        <h5 class="fw-bold mb-0">Find Transactions</h5>
                        <small class="text-secondary">Search and narrow down your records.</small>
                    </div>
                </div>

                <div class="row g-3">

                    <div class="col-lg-4">
                        <label for="searchTransaction" class="form-label">Search Description</label>
                        <div class="input-group history-input-group">
                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="search" class="form-control" id="searchTransaction" placeholder="Search transactions...">
                        </div>
                    </div>

                    <div class="col-md-6 col-lg-2">
                        <label for="filterType" class="form-label">Transaction Type</label>
                        <select class="form-select" id="filterType">
                            <option value="">All Types</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="col-md-6 col-lg-2">
                        <label for="startDate" class="form-label">From Date</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>

                    <div class="col-md-6 col-lg-2">
                        <label for="endDate" class="form-label">To Date</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>

                    <div class="col-md-6 col-lg-2 d-flex align-items-end">
                        <button type="button" id="resetFilters" class="btn btn-light border w-100 history-reset-btn">
                            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Filters
                        </button>
                    </div>

                </div>
            </div>

            <!-- Transactions Table -->
            <div class="history-panel">

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                    <div>
                        <h5 class="fw-bold mb-1">All Transactions</h5>
                        <small class="text-secondary">Your complete financial activity</small>
                    </div>

                    <span class="history-count" id="transactionCount">
                        <i class="bi bi-receipt me-1"></i>0 Transactions
                    </span>
                </div>

                <div class="table-responsive">
                    <table class="table history-table align-middle mb-0">

                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Payment Method</th>
                                <th>Amount</th>
                                <th>Date & Time</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td colspan="6">
                                    <div class="history-empty-state">
                                        <div class="history-empty-icon">
                                            <i class="bi bi-receipt"></i>
                                        </div>
                                        <h6 class="fw-bold mb-1">No transactions yet</h6>
                                        <p class="text-secondary small mb-3">Your recorded income and expenses will appear here.</p>
                                        <a href="transaction.html" class="btn btn-success btn-sm rounded-pill px-3">
                                            <i class="bi bi-plus-lg me-1"></i>Add Transaction
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>

            </div>

        </main>
    </div>

    <div id="bottom-nav"></div>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/history.js"></script>

</body>
</html>
